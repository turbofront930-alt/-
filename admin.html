<label>الوزن / الحجم:</label>
<select id="p-weight">
    <option value="ربع كيلو">ربع كيلو</option>
    <option value="نص كيلو">نص كيلو</option>
    <option value="كيلو كامل">كيلو كامل</option>
</select>

<script>
    // تعديل دالة save لتشمل الوزن
    function save() {
        const name = document.getElementById('p-name').value;
        const price = document.getElementById('p-price').value;
        const oldPrice = document.getElementById('p-old').value;
        const status = document.getElementById('p-status').value;
        const cat = document.getElementById('p-cat').value;
        const weight = document.getElementById('p-weight').value; // الخانة الجديدة

        if(!name || !price) return alert("املا البيانات يا هندسة");

        db.collection("products").doc(name).set({
            name, 
            price: parseInt(price), 
            oldPrice: oldPrice ? parseInt(oldPrice) : null,
            status, 
            category: cat,
            weight: weight // حفظ الوزن في السيرفر
        }).then(() => {
            alert("تم التحديث بنجاح!");
        });
    }
</script>
