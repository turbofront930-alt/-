<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة تحكم حبه بن - إدارة الأصناف</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f4; padding: 20px; text-align: right; }
        .container { max-width: 500px; background: white; padding: 25px; border-radius: 12px; margin: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h3 { text-align: center; color: #3d2b1f; border-bottom: 2px solid #f39c12; padding-bottom: 10px; }
        input, select, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; font-size: 1rem; }
        button { background: #3d2b1f; color: white; font-weight: bold; cursor: pointer; border: none; transition: 0.3s; }
        button:hover { background: #5d4037; }
        .btn-fast { background: #e67e22; margin-top: 25px; border: 2px solid #d35400; }
        .section-title { margin-top: 20px; font-weight: bold; color: #d35400; display: block; }
    </style>
</head>
<body>

<div class="container">
    <h3>إدارة منيو حبه بن ☕</h3>
    
    <span class="section-title">إضافة صنف يدوي:</span>
    <select id="cat">
        <option value="قهوة">بن مطحون</option>
        <option value="نكهات">بن نكهات</option>
        <option value="نسكافيه">نسكافيه</option>
    </select>
    <input type="text" id="name" placeholder="اسم الصنف (مثلاً: بن فاتح محوج)">
    <input type="number" id="price" placeholder="السعر (ج.م)">
    <input type="text" id="weight" placeholder="الوزن" value="1/4 ك">

    <button onclick="add()">حفظ الصنف 💾</button>

    <hr style="margin: 30px 0;">
    
    <span class="section-title">التشغيل الذكي:</span>
    <p style="font-size: 0.85rem; color: #666;">سيتم رفع "الساده" و "المحوج" كأصناف منفصلة بناءً على قائمة الأسعار.</p>
    <button class="btn-fast" onclick="fastUploadMenu()">🚀 رفع المنيو الكاملة (ساده ومحوج)</button>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDHuRCchoNyx7Zx4T0OB_ayi_m2X83018E",
        authDomain: "habbat-bun-store.firebaseapp.com",
        projectId: "habbat-bun-store",
        storageBucket: "habbat-bun-store.firebasestorage.app",
        messagingSenderId: "685516631891",
        appId: "1:685516631891:web:947262df61561c2dabfba6"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function add() {
        const n = document.getElementById('name').value;
        const p = document.getElementById('price').value;
        const c = document.getElementById('cat').value;
        const w = document.getElementById('weight').value;

        if(!n || !p) return alert("برجاء إدخال البيانات كاملة");

        await db.collection("منتجات").doc(n).set({
            "اسم": n, "سعر": parseInt(p), "فئة": c, "الوزن": w, "حالة": "متاح"
        });
        alert("تم الحفظ!");
    }

    async function fastUploadMenu() {
        const fullMenu = [
            // بن مطحون - ســــاده
            { "اسم": "بن اسبيشيال فاتح (ساده)", "سعر": 140, "فئة": "قهوة", "الوزن": "1/4 ك", "حالة": "متاح" },
            { "اسم": "بن صحصحة وسط (ساده)", "سعر": 170, "فئة": "قهوة", "الوزن": "1/4 ك", "حالة": "متاح" },
            { "اسم": "بن الروقان وسط (ساده)", "سعر": 150, "فئة": "قهوة", "الوزن": "1/4 ك", "حالة": "متاح" },
            { "اسم": "بن الكيف وسط (ساده)", "سعر": 150, "فئة": "قهوة", "الوزن": "1/4 ك", "حالة": "متاح" },
            { "اسم": "بن مزاج فاتح (ساده)", "سعر": 140, "فئة": "قهوة", "الوزن": "1/4 ك", "حالة": "متاح" },
            { "اسم": "بن غامق (ساده)", "سعر": 140, "فئة": "قهوة", "الوزن": "1/4 ك", "حالة": "متاح" },

            // بن مطحون - محــــوج
            { "اسم": "بن اسبيشيال فاتح (محوج)", "سعر": 160, "فئة": "قهوة", "الوزن": "1/4 ك", "حالة": "متاح" },
            { "اسم": "بن صحصحة وسط (محوج)", "سعر": 190, "فئة": "قهوة", "الوزن": "1/4 ك", "حالة": "متاح" },
            { "اسم": "بن الروقان وسط (محوج)", "سعر": 160, "فئة": "قهوة", "الوزن": "1/4 ك", "حالة": "متاح" },
            { "اسم": "بن الكيف وسط (محوج)", "سعر": 165, "فئة": "قهوة", "الوزن": "1/4 ك", "حالة": "متاح" },
            { "اسم": "بن مزاج فاتح (محوج)", "سعر": 150, "فئة": "قهوة", "الوزن": "1/4 ك", "حالة": "متاح" },
            { "اسم": "بن غامق (محوج)", "سعر": 150, "فئة": "قهوة", "الوزن": "1/4 ك", "حالة": "متاح" },
            { "اسم": "اسبريسو", "سعر": 170, "فئة": "قهوة", "الوزن": "1/4 ك", "حالة": "متاح" },

            // بن نكهات
            { "اسم": "بن فرنساوي", "سعر": 110, "فئة": "نكهات", "الوزن": "1/4 ك", "حالة": "متاح" },
            { "اسم": "بن بندق", "سعر": 110, "فئة": "نكهات", "الوزن": "1/4 ك", "حالة": "متاح" },
            { "اسم": "بن بندق قطع", "سعر": 130, "فئة": "نكهات", "الوزن": "1/4 ك", "حالة": "متاح" },
            { "اسم": "بن شيكولاتة", "سعر": 110, "فئة": "نكهات", "الوزن": "1/4 ك", "حالة": "متاح" },

            // نسكافيه
            { "اسم": "نسكافيه بلاك", "سعر": 250, "فئة": "نسكافيه", "الوزن": "1/4 ك", "حالة": "متاح" },
            { "اسم": "نسكافيه جولد", "سعر": 300, "فئة": "نسكافيه", "الوزن": "1/4 ك", "حالة": "متاح" },
            { "اسم": "نسكافيه 3*1", "سعر": 100, "فئة": "نسكافيه", "الوزن": "1/4 ك", "حالة": "متاح" },
            { "اسم": "نسكافيه 3*1 روقان", "سعر": 120, "فئة": "نسكافيه", "الوزن": "1/4 ك", "حالة": "متاح" }
        ];

        for(let item of fullMenu) {
            await db.collection("منتجات").doc(item["اسم"]).set(item);
        }
        alert("تم رفع المنيو كاملة بنجاح (ساده ومحوج) ✅");
    }
</script>
</body>
</html>
