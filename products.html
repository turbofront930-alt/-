<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر حبه بن</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        :root { --p: #3d2b1f; --g: #f39c12; --w: #ecf0f1; --a: #d35400; }
        body { font-family: 'Segoe UI', Tahoma; background: var(--p) url('back.jpg') fixed center; background-size: cover; color: var(--w); margin: 0; padding-bottom: 80px; }
        .header { background: rgba(0,0,0,0.6); padding: 20px; text-align: center; border-bottom: 2px solid var(--g); }
        .tabs { display: flex; justify-content: center; gap: 10px; padding: 15px; position: sticky; top: 0; background: var(--p); z-index: 100; }
        .tab-btn { background: none; border: 2px solid var(--g); color: var(--g); padding: 8px 15px; border-radius: 20px; cursor: pointer; }
        .tab-btn.active { background: var(--g); color: var(--p); font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; padding: 20px; }
        .card { background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); border-radius: 15px; padding: 20px; text-align: center; border: 1px solid var(--g); }
        .price { font-size: 1.5rem; color: var(--g); font-weight: bold; }
        .old-price { text-decoration: line-through; color: #aaa; font-size: 0.9rem; margin-left: 10px; }
        .weight { color: var(--a); font-weight: bold; margin: 10px 0; }
        .add-btn { background: var(--g); border: none; color: var(--p); width: 100%; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .cart-bar { position: fixed; bottom: 0; width: 100%; background: var(--g); color: var(--p); text-align: center; padding: 15px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header"><img src="logo.png" width="100"></div>
    <div class="tabs">
        <button class="tab-btn active" onclick="changeTab('coffee', this)">بن مطحون</button>
        <button class="tab-btn" onclick="changeTab('flavors', this)">بن نكهات</button>
        <button class="tab-btn" onclick="changeTab('nescafe', this)">نسكافيه</button>
    </div>
    <div id="grid" class="grid"></div>
    <div class="cart-bar" onclick="sendOrder()">إتمام الطلب (<span id="cart-count">0</span>)</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDHuRCchoNyx7Zx4T0OB_ayi_m2X83018E",
        authDomain: "habbat-bun-store.firebaseapp.com",
        projectId: "habbat-bun-store",
        storageBucket: "habbat-bun-store.firebasestorage.app",
        messagingSenderId: "685516631891",
        appId: "1:685516631891:web:947262df61561c2dabfba6"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    let currentCat = 'coffee';

    function loadProducts() {
        const grid = document.getElementById('grid');
        // تحويل الفئة للعربي عشان يطابق الفايربيز عندك
        const catMap = { 'coffee': 'قهوة', 'flavors': 'نكهات', 'nescafe': 'نسكافيه' };
        
        db.collection("منتجات").where("فئة", "==", catMap[currentCat]).onSnapshot((qs) => {
            grid.innerHTML = '';
            qs.forEach((doc) => {
                const i = doc.data();
                const weight = i["الوزن"] || 'ربع كيلو';
                grid.innerHTML += `
                    <div class="card">
                        <h3>${i["اسم"]}</h3>
                        <p class="weight">الوزن: ${weight}</p>
                        <p>
                            ${i["السعر القديم"] ? `<span class="old-price">${i["السعر القديم"]} ج.م</span>` : ''}
                            <span class="price">${i["سعر"]} ج.م</span>
                        </p>
                        <button class="add-btn" onclick="addToCart('${i["اسم"]} (${weight})', ${i["سعر"]})">إضافة للسلة</button>
                    </div>`;
            });
        });
    }
    function changeTab(c, b) { currentCat = c; document.querySelectorAll('.tab-btn').forEach(x => x.classList.remove('active')); b.classList.add('active'); loadProducts(); }
    loadProducts();
</script>
<script src="script.js"></script>
</body>
</html>
