<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر حبه بن | المتجر الذكي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <style>
        :root { --primary: #2D1B13; --accent: #C5A059; }
        body { font-family: 'Cairo', sans-serif; background-image: url('1000216005.jpg'); background-size: cover; background-attachment: fixed; margin: 0; color: #fff; }
        .main-wrapper { background: rgba(0,0,0,0.7); min-height: 100vh; padding-bottom: 50px; }
        nav { background: var(--primary); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; border-bottom: 3px solid var(--accent); }
        .logo { height: clamp(70px, 15vw, 120px); }
        .tabs-container { background: rgba(45, 27, 19, 0.9); padding: 10px; display: flex; overflow-x: auto; position: sticky; top: 100px; z-index: 999; border-bottom: 1px solid var(--accent); }
        .tab-btn { padding: 8px 15px; color: #fff; border: 1px solid var(--accent); background: none; margin: 0 5px; cursor: pointer; border-radius: 5px; white-space: nowrap; }
        .tab-btn.active { background: var(--accent); color: var(--primary); font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; padding: 20px; }
        .card { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 20px; border-radius: 12px; border: 1px solid rgba(197,160,89,0.2); text-align: center; }
        .add-btn { width: 100%; background: var(--accent); color: var(--primary); border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .loading-msg { text-align: center; grid-column: 1/-1; padding: 50px; font-size: 1.2rem; }
    </style>
</head>
<body>

<div class="main-wrapper">
    <nav>
        <img src="logo.png" class="logo">
        <div style="color:var(--accent); font-size:1.5rem; cursor:pointer;" onclick="toggleCart()">🛒 <span id="cart-count">0</span></div>
    </nav>

    <div class="tabs-container">
        <button class="tab-btn active" onclick="changeTab('coffee', this)">بن مطحون</button>
        <button class="tab-btn" onclick="changeTab('flavors', this)">بن نكهات</button>
        <button class="tab-btn" onclick="changeTab('nescafe', this)">نسكافيه</button>
    </div>

    <div id="products-grid" class="grid">
        <div class="loading-msg">جاري جلب الأسعار المحدثة من السيرفر...</div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDHuRCchoNyx7Zx4T0OB_ayi_m2X83018E",
        authDomain: "habbat-bun-store.firebaseapp.com",
        projectId: "habbat-bun-store",
        storageBucket: "habbat-bun-store.firebasestorage.app",
        messagingSenderId: "685516631891",
        appId: "1:685516631891:web:947262df61561c2dabfba6"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    let currentCat = 'coffee';

    function loadProducts() {
        const grid = document.getElementById('products-grid');
        db.collection("products").where("category", "==", currentCat)
        .onSnapshot((querySnapshot) => {
            grid.innerHTML = '';
            querySnapshot.forEach((doc) => {
                const item = doc.data();
                grid.innerHTML += `
                    <div class="card">
                        <h3 style="color:var(--accent);">${item.name}</h3>
                        <p>السعر الحالي: ${item.price} ج.م</p>
                        <button class="add-btn" onclick="addToCart('${item.name}', ${item.price})">إضافة للسلة</button>
                    </div>
                `;
            });
        });
    }

    function changeTab(cat, btn) {
        currentCat = cat;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        loadProducts();
    }
    loadProducts();
</script>
<script src="script.js"></script>
</body>
</html>
