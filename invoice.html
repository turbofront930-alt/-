<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>فاتورة حبه بن</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #fff; padding: 20px; direction: rtl; }
        .invoice { max-width: 400px; margin: auto; border: 2px dashed #2D1B13; padding: 20px; }
        .logo { display: block; margin: 0 auto 10px; height: 60px; }
        .header { text-align: center; border-bottom: 1px solid #eee; margin-bottom: 15px; }
        .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px inset #f9f9f9; }
        .total { font-size: 1.4rem; font-weight: bold; color: #2D1B13; margin-top: 15px; text-align: center; }
        .no-print { margin-top: 20px; text-align: center; }
        button { background: #C5A059; padding: 10px 20px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body>

<div class="invoice">
    <div class="header">
        <img src="logo.png" class="logo">
        <h3>فاتورة مشتريات - حبه بن</h3>
        <p id="date" style="font-size: 12px;"></p>
    </div>
    
    <div id="list"></div>
    
    <div class="total">الإجمالي: <span id="total"></span> ج.م</div>
    
    <div class="no-print">
        <button onclick="window.print()">تحميل الفاتورة PDF</button>
        <p style="font-size: 11px; color: #888; margin-top: 10px;">برجاء تصوير الشاشة (Screenshot) للذكرى</p>
    </div>
</div>

<script>
    const data = JSON.parse(localStorage.getItem('lastOrder'));
    if(data) {
        document.getElementById('date').innerText = data.date;
        document.getElementById('total').innerText = data.total;
        const list = document.getElementById('list');
        data.items.forEach(i => {
            list.innerHTML += `<div class="row"><span>${i.name}</span><span>${i.price} ج.م</span></div>`;
        });
    }
</script>
</body>
</html>
